# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
# Pinned to match the actual NeoForge build the test game instance runs (26.1.2.94) - a
# mismatch here compiles fine in the dev environment (IntelliJ's runClient uses this same
# version) but breaks at runtime against a differently-built NeoForge jar, e.g. the
# LootModifier.codecStart NoSuchMethodError this caused.
neoforge_version=26.1.2.94
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
